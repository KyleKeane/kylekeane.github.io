<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<title>Page moved — {{ site.title | escape }}</title>
<link rel="canonical" href="{{ page.redirect.to | absolute_url }}">
<meta http-equiv="refresh" content="0; url={{ page.redirect.to | absolute_url }}">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<main id="main-content">
<h1>Page moved</h1>
<p>This page has moved. <a href="{{ page.redirect.to | absolute_url }}">Continue to the new location</a>.</p>
</main>
</body>
</html>
