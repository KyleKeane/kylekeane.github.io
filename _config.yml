title: "Dr. Kyle Keane"
description: >-
  Personal website of Dr. Kyle Keane, Senior Lecturer in Assistive
  Technologies at the University of Bristol. Research at the intersection
  of artificial intelligence, human cognition, and assistive technology
  design.
author: "Kyle Michael Keane"
url: "https://kylekeane.github.io"
lang: en

theme: minima

# CV entries: one markdown file per item under _cv/, tagged by persona.
# output: false keeps the entries out of _site (they render only through
# the cv-sections.html include on the CV pages).
collections:
  cv:
    output: false

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - _briefing/
  - docs/
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
