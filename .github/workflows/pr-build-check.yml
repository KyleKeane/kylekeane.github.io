name: PR build & lint

on:
  pull_request:
    branches: ["main"]

# Match the deploy workflow's permissions so actions/configure-pages and
# actions/jekyll-build-pages have what they need.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    outputs:
      site_path: ./_site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo state for diagnostics
        shell: bash
        run: |
          set -x
          ls -la
          echo '--- _config.yml ---'
          cat _config.yml
          echo '--- ruby/jekyll versions ---'
          ruby --version || true
          gem list jekyll 2>/dev/null || true

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Show built site for diagnostics
        if: always()
        shell: bash
        run: |
          set -x
          if [ -d _site ]; then
            ls -la _site
            echo '--- generated HTML pages ---'
            find _site -maxdepth 2 -name '*.html' | sort
          else
            echo "_site does not exist — Jekyll build did not produce output"
          fi

      - name: Upload built site for downstream jobs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1
          if-no-files-found: error

  exclusions:
    name: Verify source material is not published
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Check for leaked source material
        shell: bash
        run: |
          set -euxo pipefail
          leaks=$(find _site \( \
              -path '*_research*' \
              -o -name 'seed*' \
              -o -name 'claude-cv-verification*' \
              -o -name 'website-updates*' \
              -o -name 'recent-records*' \
              -o -path '*/docs/*' \
              -o -name 'CLAUDE.md' \
              -o -name 'CLAUDE.html' \
            \) 2>/dev/null || true)
          if [ -n "$leaks" ]; then
            echo "::error::Source material or dev docs leaked into _site:"
            echo "$leaks"
            exit 1
          fi
          echo "No source material leaked into _site."

  accessibility:
    name: Accessibility lint of built HTML
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Lint built HTML
        shell: bash
        run: |
          set -uo pipefail
          set -x
          fail=0
          shopt -s nullglob
          html_files=( _site/*.html )
          if [ ${#html_files[@]} -eq 0 ]; then
            echo "::error::No HTML files in _site"
            exit 1
          fi
          for f in "${html_files[@]}"; do
            # Exactly one <h1>. Use grep -c with || true to survive set -e + no-match.
            n=$(grep -cE '<h1[ >]' "$f" || true)
            if [ "$n" -ne 1 ]; then
              echo "::error file=$f::expected exactly 1 <h1>, found $n"
              fail=1
            fi

            # No skipped heading levels (h1 -> h3 etc.)
            levels=$(grep -oE '<h[1-6]' "$f" | grep -oE '[1-6]' || true)
            prev=0
            for lvl in $levels; do
              if [ "$prev" -ne 0 ] && [ "$lvl" -gt "$((prev+1))" ]; then
                echo "::error file=$f::heading skip from h$prev to h$lvl"
                fail=1
              fi
              prev=$lvl
            done

            # Every <img> has alt=
            bad_imgs=$(grep -oE '<img[^>]*>' "$f" | grep -v 'alt=' || true)
            if [ -n "$bad_imgs" ]; then
              echo "::error file=$f::<img> without alt attribute"
              echo "$bad_imgs"
              fail=1
            fi

            # No generic link text
            if grep -iE '>(click here|read more)</a>' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::generic link text (click here / read more)"
              grep -niE '>(click here|read more)</a>' "$f" || true
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Accessibility lint passed for ${#html_files[@]} pages."

  links:
    name: Check internal links
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Run lychee on built HTML (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir is the option lychee actually uses to resolve absolute
          # local paths like /work.html (not --base, which is for relative URLs).
          # Use absolute paths via ${{ github.workspace }} to sidestep cwd quirks.
          args: --offline --no-progress --include-fragments --root-dir ${{ github.workspace }}/_site ${{ github.workspace }}/_site/**/*.html
          fail: true
